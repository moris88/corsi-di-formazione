<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="robots" content="noindex" />
    <title>Pagina non trovata · Corsi di formazione</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/errore.css" />
  </head>
  <body class="page-portal error-page">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Tutte le certificazioni" title="Tutte le certificazioni">
        <img src="assets/icon.svg" class="brand-logo" alt="" aria-hidden="true" />
        <span class="brand-name">Corsi di formazione</span>
      </a>
    </header>
    <main class="error-main">
      <section class="error-box" aria-labelledby="error-title">
        <p class="error-code" aria-hidden="true">404</p>
        <div class="eyebrow">Errore 404</div>
        <h1 id="error-title">Pagina non trovata</h1>
        <p>
          L’indirizzo che hai aperto non esiste o è stato spostato. Puoi tornare alla
          pagina iniziale per scegliere un percorso di studio.
        </p>
        <div class="error-actions">
          <a class="button" href="index.html">Vai alla home page <span aria-hidden="true">→</span></a>
        </div>
      </section>
    </main>
  </body>
</html>
